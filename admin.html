<!DOCTYPE html>
<html lang="en" data-theme="loveboo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Love Boo | Registrations Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#006D68">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>
  /* Love Boo theme for daisyUI: every component below picks these up. */
  [data-theme="loveboo"] {
    color-scheme: light;
    --color-base-100: #FFFFFF;
    --color-base-200: #FCF9F1;
    --color-base-300: #E3EABA;
    --color-base-content: #005151;
    --color-primary: #006D68;
    --color-primary-content: #FCF9F1;
    --color-secondary: #C3DC93;
    --color-secondary-content: #005151;
    --color-accent: #F8B5C4;
    --color-accent-content: #005151;
    --color-neutral: #005151;
    --color-neutral-content: #FCF9F1;
    --color-info: #9FD3CE;
    --color-info-content: #005151;
    --color-success: #C3DC93;
    --color-success-content: #005151;
    --color-warning: #FBD872;
    --color-warning-content: #005151;
    --color-error: #A5321F;
    --color-error-content: #FFFFFF;
    --radius-selector: 999px;
    --radius-field: 0.75rem;
    --radius-box: 1rem;
    --border: 1.5px;
  }
  body { font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #FCF9F1; }
  [x-cloak] { display: none !important; }
  /* Keep inputs >=16px so iOS doesn't zoom on focus */
  .input, .select, .file-input { font-size: max(16px, 0.95rem); }
</style>
</head>
<body class="min-h-dvh text-base-content"
      x-data="adminApp()" x-init="init()" x-cloak>

<!-- ============ Login ============ -->
<main x-show="view === 'login'" class="min-h-dvh flex items-center justify-center p-6">
  <div class="card bg-base-100 border border-secondary w-full max-w-sm">
    <form class="card-body gap-3" @submit.prevent="login()">
      <img src="https://loveboo.com/cdn/shop/files/Group_240724.png?v=1757584837&width=250" alt="Love Boo" class="w-30 mx-auto mb-1">
      <h1 class="text-center font-extrabold text-lg mb-2">Registrations Admin</h1>

      <div role="alert" class="alert alert-error alert-soft text-sm" x-show="loginError" x-text="loginError"></div>

      <label class="floating-label">
        <span>Email</span>
        <input type="email" required autocomplete="username" placeholder="Email"
               class="input input-bordered w-full bg-base-200" x-model="email">
      </label>
      <label class="floating-label">
        <span>Password</span>
        <input type="password" required autocomplete="current-password" placeholder="Password"
               class="input input-bordered w-full bg-base-200" x-model="password">
      </label>

      <button type="submit" class="btn btn-primary btn-block mt-2" :disabled="loggingIn">
        <span class="loading loading-spinner loading-sm" x-show="loggingIn"></span>
        <span x-text="loggingIn ? 'Logging in...' : 'Log In'"></span>
      </button>
    </form>
  </div>
</main>

<!-- ============ Dashboard ============ -->
<div x-show="view === 'dash'" class="max-w-[90rem] mx-auto px-4 sm:px-8 pt-5 pb-12">

  <header class="flex flex-wrap items-center justify-between gap-3 mb-5">
    <div class="flex items-center gap-3">
      <img src="https://loveboo.com/cdn/shop/files/Group_240724.png?v=1757584837&width=64" alt="Love Boo" class="w-8">
      <h1 class="text-lg font-extrabold">Baby Expo 2026 Registrations</h1>
    </div>
    <div class="flex gap-2">
      <button type="button" class="btn btn-outline btn-primary btn-sm" @click="loadRegistrations()">Refresh</button>
      <button type="button" class="btn btn-outline btn-primary btn-sm" @click="downloadCsv()">Export CSV</button>
      <button type="button" class="btn btn-primary btn-sm" @click="signOut()">Sign Out</button>
    </div>
  </header>

  <!-- Stats -->
  <section class="stats stats-vertical sm:stats-horizontal bg-base-100 border border-secondary w-full mb-5">
    <div class="stat">
      <div class="stat-title">Registrations</div>
      <div class="stat-value text-primary" x-text="rows.length"></div>
    </div>
    <div class="stat">
      <div class="stat-title">Prizes won</div>
      <div class="stat-value text-primary" x-text="rows.filter(r => r.prize).length"></div>
    </div>
    <div class="stat">
      <div class="stat-title">Parents</div>
      <div class="stat-value text-primary" x-text="rows.filter(r => (r.is_parent || '').toLowerCase() === 'yes').length"></div>
    </div>
  </section>

  <!-- Tabs -->
  <div role="tablist" class="tabs tabs-box bg-base-300/50 mb-4 w-fit">
    <button role="tab" type="button" class="tab" :class="tab === 'registrations' && 'tab-active'" @click="tab = 'registrations'">Registrations</button>
    <button role="tab" type="button" class="tab" :class="tab === 'prizes' && 'tab-active'" @click="openPrizes()">Wheel Prizes</button>
  </div>

  <!-- Registrations -->
  <section x-show="tab === 'registrations'">
    <div class="flex flex-wrap items-center gap-3 mb-3">
      <label class="input input-bordered flex-1 min-w-48 bg-base-100">
        <svg class="h-4 w-4 opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" class="grow" placeholder="Search by name or email..." x-model="search">
      </label>
      <span class="text-sm opacity-75 whitespace-nowrap" x-text="filtered.length + (filtered.length === 1 ? ' registration' : ' registrations')"></span>
    </div>

    <!-- Phones: one card per registration -->
    <div class="sm:hidden flex flex-col gap-3">
      <template x-for="r in filtered" :key="r.id">
        <div class="card bg-base-100 border border-secondary">
          <div class="card-body p-4 gap-1 text-sm">
            <div class="flex items-start justify-between gap-2">
              <p class="font-extrabold text-base break-words" x-text="[r.first_name, r.last_name].filter(Boolean).join(' ')"></p>
              <span class="badge badge-accent badge-sm shrink-0" x-show="r.prize" x-text="r.prize"></span>
            </div>
            <p class="break-all" x-text="r.email"></p>
            <p x-show="r.phone" x-text="r.phone"></p>
            <div class="flex flex-wrap items-center gap-2 mt-1 text-xs opacity-75">
              <span class="badge badge-secondary badge-sm" x-text="'Parent: ' + (r.is_parent || '—')"></span>
              <span x-text="r.source || ''"></span>
              <span x-text="formatDate(r.created_at)"></span>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- Tablet and up: table -->
    <div class="hidden sm:block card bg-base-100 border border-secondary overflow-auto max-h-[65vh]">
      <table class="table table-pin-rows table-zebra">
        <thead>
          <tr class="bg-base-300">
            <th>Name</th><th>Email</th><th>Phone</th><th>Parent?</th><th>Source</th><th>Prize</th><th>Registered</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="r in filtered" :key="r.id">
            <tr class="hover:bg-base-200">
              <td class="font-semibold whitespace-nowrap" x-text="[r.first_name, r.last_name].filter(Boolean).join(' ')"></td>
              <td x-text="r.email"></td>
              <td class="whitespace-nowrap" x-text="r.phone || '—'"></td>
              <td><span class="badge badge-secondary badge-sm" x-text="r.is_parent || '—'"></span></td>
              <td x-text="r.source || '—'"></td>
              <td>
                <span class="badge badge-accent badge-sm" x-show="r.prize" x-text="r.prize"></span>
                <span x-show="!r.prize">—</span>
              </td>
              <td class="whitespace-nowrap" x-text="formatDate(r.created_at)"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
    <div class="text-center py-12 opacity-70" x-show="loading"><span class="loading loading-dots loading-md"></span></div>
    <div class="text-center py-12 opacity-70" x-show="!loading && !filtered.length" x-text="loadError || 'No registrations yet.'"></div>
  </section>

  <!-- Prizes -->
  <section x-show="tab === 'prizes'">
    <form class="card bg-base-100 border border-secondary mb-5" @submit.prevent="addPrize($refs.prizeForm)" x-ref="prizeForm">
      <div class="card-body sm:flex-row flex-col items-stretch sm:items-end gap-3 p-4">
        <label class="form-control flex-1 min-w-40">
          <span class="label-text text-xs font-bold mb-1">Prize name</span>
          <input type="text" required placeholder="e.g. Baby Carrier" class="input input-bordered w-full bg-base-200" x-model="prizeName">
        </label>
        <label class="form-control flex-1 min-w-40">
          <span class="label-text text-xs font-bold mb-1">Prize image</span>
          <input type="file" accept="image/*" required class="file-input file-input-bordered w-full bg-base-200" @change="prizeFile = $event.target.files[0]">
        </label>
        <label class="form-control sm:w-32">
          <span class="label-text text-xs font-bold mb-1">Quantity</span>
          <input type="number" min="1" step="1" placeholder="Unlimited" class="input input-bordered w-full bg-base-200" x-model="prizeQty">
        </label>
        <button type="submit" class="btn btn-primary" :disabled="addingPrize">
          <span class="loading loading-spinner loading-sm" x-show="addingPrize"></span>
          <span x-text="addingPrize ? 'Adding...' : 'Add Prize'"></span>
        </button>
      </div>
    </form>

    <div role="alert" class="alert alert-error alert-soft mb-4 text-sm" x-show="prizeError" x-text="prizeError"></div>

    <div class="grid grid-cols-[repeat(auto-fill,minmax(11rem,1fr))] gap-4">
      <template x-for="p in prizes" :key="p.id">
        <div class="card bg-base-100 border border-secondary text-center">
          <figure class="px-3 pt-3">
            <div class="aspect-square w-full rounded-xl bg-base-200 overflow-hidden flex items-center justify-center text-xs opacity-60">
              <img x-show="p.image_url" :src="p.image_url" alt="" class="w-full h-full object-cover">
              <span x-show="!p.image_url">No image</span>
            </div>
          </figure>
          <div class="card-body p-3 gap-1 items-center">
            <p class="font-bold text-sm break-words" x-text="p.name"></p>
            <span class="badge badge-sm" :class="soldOut(p) ? 'badge-error' : 'badge-secondary'" x-text="stockLabel(p)"></span>
            <div class="flex gap-2 w-full mt-2">
              <button type="button" class="btn btn-outline btn-primary btn-sm flex-1" @click="openEdit(p)">Edit</button>
              <button type="button" class="btn btn-outline btn-error btn-sm flex-1" @click="confirmRemove(p)">Remove</button>
            </div>
          </div>
        </div>
      </template>
    </div>
    <div class="text-center py-12 opacity-70" x-show="prizesLoading"><span class="loading loading-dots loading-md"></span></div>
    <div class="text-center py-12 opacity-70" x-show="!prizesLoading && !prizes.length"
         x-text="prizesLoadError || 'No prizes added yet — the wheel will use a placeholder until you add some.'"></div>
  </section>
</div>

<!-- Edit prize -->
<dialog class="modal modal-bottom sm:modal-middle" x-ref="editDialog">
  <form class="modal-box" @submit.prevent="saveEdit()">
    <h3 class="font-extrabold text-lg mb-3">Edit prize</h3>
    <div class="flex flex-col gap-3" x-show="edit">
      <div class="flex items-center gap-3">
        <div class="size-16 rounded-xl bg-base-200 overflow-hidden shrink-0">
          <img :src="editPreview || (edit && edit.image_url)" alt="" class="w-full h-full object-cover" x-show="editPreview || (edit && edit.image_url)">
        </div>
        <input type="file" accept="image/*" class="file-input file-input-bordered w-full bg-base-200"
               @change="editFile = $event.target.files[0]; editPreview = editFile ? URL.createObjectURL(editFile) : ''">
      </div>
      <label class="flex flex-col gap-1">
        <span class="text-xs font-bold">Prize name</span>
        <input type="text" required class="input input-bordered w-full bg-base-200" x-model="editName">
      </label>
      <div class="grid grid-cols-2 gap-3">
        <label class="flex flex-col gap-1">
          <span class="text-xs font-bold">Quantity</span>
          <input type="number" min="1" step="1" placeholder="Unlimited" class="input input-bordered w-full bg-base-200" x-model="editQty">
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-xs font-bold">Given so far</span>
          <input type="number" min="0" step="1" class="input input-bordered w-full bg-base-200" x-model="editGiven">
        </label>
      </div>
      <div role="alert" class="alert alert-error alert-soft text-sm" x-show="editError" x-text="editError"></div>
    </div>
    <div class="modal-action">
      <button type="button" class="btn btn-ghost" @click="$refs.editDialog.close()">Cancel</button>
      <button type="submit" class="btn btn-primary" :disabled="savingEdit">
        <span class="loading loading-spinner loading-sm" x-show="savingEdit"></span>
        Save changes
      </button>
    </div>
  </form>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<!-- Remove-prize confirmation -->
<dialog class="modal" x-ref="removeDialog">
  <div class="modal-box">
    <h3 class="font-extrabold text-lg">Remove prize?</h3>
    <p class="py-3">
      <strong x-text="toRemove && toRemove.name"></strong> will be taken off the wheel.
    </p>
    <div class="modal-action">
      <form method="dialog"><button class="btn btn-ghost">Cancel</button></form>
      <button type="button" class="btn btn-error" @click="removePrize()">Remove</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script>
  const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function matches(r, q) {
    if (!q) return true;
    return [r.first_name, r.last_name, r.email].filter(Boolean).join(" ").toLowerCase().includes(q);
  }

  function adminApp() {
    return {
      view: "login", tab: "registrations",
      email: "", password: "", loginError: "", loggingIn: false,
      rows: [], search: "", loading: false, loadError: "",
      prizes: [], prizesLoading: false, prizesLoaded: false, prizesLoadError: "",
      prizeName: "", prizeQty: "", prizeFile: null, addingPrize: false, prizeError: "",
      toRemove: null,
      edit: null, editName: "", editQty: "", editGiven: 0, editFile: null, editPreview: "", editError: "", savingEdit: false,

      get filtered() {
        const q = this.search.trim().toLowerCase();
        return this.rows.filter(r => matches(r, q));
      },

      async init() {
        this.subscribeRealtime();
        const { data } = await sbClient.auth.getSession();
        if (data && data.session) this.showDash(); else this.view = "login";
      },

      showDash() {
        this.view = "dash";
        this.loadRegistrations();
      },

      async login() {
        this.loginError = "";
        this.loggingIn = true;
        const { error } = await sbClient.auth.signInWithPassword({ email: this.email.trim(), password: this.password });
        this.loggingIn = false;
        if (error) { this.loginError = error.message; return; }
        this.showDash();
      },

      async signOut() {
        await sbClient.auth.signOut();
        this.view = "login";
      },

      formatDate(iso) {
        try { return new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }); }
        catch (e) { return iso || ""; }
      },

      async loadRegistrations() {
        this.loading = true;
        this.loadError = "";
        const { data, error } = await sbClient.from("registrations").select("*").eq("klaviyo_synced", true).order("created_at", { ascending: false });
        this.loading = false;
        if (error) {
          console.error("Failed to load registrations:", error.message);
          this.rows = [];
          this.loadError = "Couldn't load registrations: " + error.message;
          return;
        }
        this.rows = data || [];
      },

      downloadCsv() {
        const headers = ["First Name", "Last Name", "Email", "Phone", "Parent", "Source", "Prize", "UTM Source", "UTM Medium", "UTM Campaign", "Registered At"];
        const csv = [headers.join(",")];
        this.filtered.forEach(r => {
          csv.push([r.first_name, r.last_name, r.email, r.phone, r.is_parent, r.source, r.prize, r.utm_source, r.utm_medium, r.utm_campaign, r.created_at]
            .map(v => '"' + (v == null ? "" : String(v)).replace(/"/g, '""') + '"').join(","));
        });
        const url = URL.createObjectURL(new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" }));
        const a = document.createElement("a");
        a.href = url;
        a.download = "loveboo-registrations-" + new Date().toISOString().slice(0, 10) + ".csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      },

      // ---- Wheel prizes ----
      openPrizes() {
        this.tab = "prizes";
        if (!this.prizesLoaded) { this.prizesLoaded = true; this.loadPrizes(); }
      },

      soldOut(p) { return p.quantity != null && (p.given_count || 0) >= p.quantity; },
      stockLabel(p) {
        const given = p.given_count || 0;
        return p.quantity == null ? given + " given · unlimited" : given + " / " + p.quantity + " given";
      },

      async loadPrizes() {
        this.prizesLoading = true;
        this.prizesLoadError = "";
        const { data, error } = await sbClient.from("prizes").select("*")
          .order("sort_order", { ascending: true }).order("created_at", { ascending: true });
        this.prizesLoading = false;
        if (error) {
          console.error("Failed to load prizes:", error.message);
          this.prizes = [];
          this.prizesLoadError = "Couldn't load prizes: " + error.message;
          return;
        }
        this.prizes = data || [];
      },

      async addPrize(form) {
        this.prizeError = "";
        const name = this.prizeName.trim();
        const file = this.prizeFile;
        if (!name || !file) return;
        this.addingPrize = true;
        try {
          const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
          const path = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
          const { error: uploadError } = await sbClient.storage.from("prize-images").upload(path, file, { cacheControl: "3600", upsert: false });
          if (uploadError) throw uploadError;
          const { data: pub } = sbClient.storage.from("prize-images").getPublicUrl(path);
          const qtyRaw = String(this.prizeQty).trim();
          const { error: insertError } = await sbClient.from("prizes").insert({
            name, image_url: pub.publicUrl, image_path: path,
            quantity: qtyRaw ? parseInt(qtyRaw, 10) : null,
            sort_order: Date.now()
          });
          if (insertError) throw insertError;
          form.reset();
          this.prizeName = ""; this.prizeQty = ""; this.prizeFile = null;
          this.loadPrizes();
        } catch (err) {
          this.prizeError = "Couldn't add prize: " + (err.message || err);
        } finally {
          this.addingPrize = false;
        }
      },

      openEdit(p) {
        this.edit = p;
        this.editName = p.name;
        this.editQty = p.quantity == null ? "" : p.quantity;
        this.editGiven = p.given_count || 0;
        this.editFile = null;
        this.editPreview = "";
        this.editError = "";
        this.$refs.editDialog.showModal();
      },

      async saveEdit() {
        const p = this.edit;
        const name = this.editName.trim();
        if (!p || !name) return;
        this.savingEdit = true;
        this.editError = "";
        try {
          const qtyRaw = String(this.editQty).trim();
          const changes = {
            name,
            quantity: qtyRaw ? parseInt(qtyRaw, 10) : null,
            given_count: Math.max(0, parseInt(this.editGiven, 10) || 0)
          };
          let oldPath = null;
          if (this.editFile) {
            const file = this.editFile;
            const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
            const path = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
            const { error: upErr } = await sbClient.storage.from("prize-images").upload(path, file, { cacheControl: "3600", upsert: false });
            if (upErr) throw upErr;
            changes.image_url = sbClient.storage.from("prize-images").getPublicUrl(path).data.publicUrl;
            changes.image_path = path;
            oldPath = p.image_path;
          }
          const { error } = await sbClient.from("prizes").update(changes).eq("id", p.id);
          if (error) throw error;
          if (oldPath) sbClient.storage.from("prize-images").remove([oldPath]).catch(() => {});
          this.$refs.editDialog.close();
          this.loadPrizes();
        } catch (err) {
          this.editError = "Couldn't save: " + (err.message || err);
        } finally {
          this.savingEdit = false;
        }
      },

      confirmRemove(p) {
        this.toRemove = p;
        this.$refs.removeDialog.showModal();
      },

      async removePrize() {
        const p = this.toRemove;
        this.$refs.removeDialog.close();
        if (!p) return;
        this.prizeError = "";
        const { error } = await sbClient.from("prizes").delete().eq("id", p.id);
        if (error) {
          console.error("Failed to remove prize:", error.message);
          this.prizeError = "Couldn't remove prize: " + error.message;
          return;
        }
        if (p.image_path) {
          sbClient.storage.from("prize-images").remove([p.image_path]).catch(err => console.warn("Could not delete prize image from storage:", err));
        }
        this.toRemove = null;
        this.loadPrizes();
      },

      // Live updates: new registrations appear, and prizes fill in the moment
      // the booth's wheel finishes someone's spin, with no manual refresh.
      subscribeRealtime() {
        sbClient.channel("registrations-changes")
          .on("postgres_changes", { event: "INSERT", schema: "public", table: "registrations" }, payload => {
            if (payload.new.klaviyo_synced) this.rows = [payload.new].concat(this.rows);
          })
          .on("postgres_changes", { event: "UPDATE", schema: "public", table: "registrations" }, payload => {
            const idx = this.rows.findIndex(r => r.id === payload.new.id);
            if (idx !== -1) this.rows[idx] = payload.new;
          })
          .subscribe();
      }
    };
  }
</script>
